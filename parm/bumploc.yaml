_output config: &outputConfig
  date: &validDate '@analysisDate@'
  stream name: control
geometry:
  nml_file: "./namelist.atmosphere"
  streams_file: "./streams.atmosphere"
  deallocate non-da fields: true
  bump vunit: "modellevel" # modellevel, height
background:
  state variables: &vars [water_vapor_mixing_ratio_wrt_moist_air, air_pressure_at_surface, air_temperature, northward_wind, eastward_wind, SM1, SM2, SM3, SM4, SM5, SM6, SM7, SM8, SM9, ST1, ST2, ST3, ST4, ST5, ST6, ST7, ST8, ST9]
  #[spechum,surface_pressure,temperature,uReconstructMeridional,uReconstructZonal]
  filename: ./mpasin.nc
  #"./data/restart.2024-05-27_00.00.00.nc"
  date: *validDate

background error:
  covariance model: SABER

  saber central block:
    saber block name: BUMP_NICAS
    calibration:
      io:
        files prefix: bumploc
        #_401km11levels

      drivers:
        multivariate strategy: duplicated
        compute nicas: true
        write local nicas: true
        #write nicas grids: true
        internal dirac test: false
      model:
        level for 2d variables: last
      nicas:
        resolution: 8.0
        explicit length-scales: true
        horizontal length-scale:
          - groups: [common]
            value: 401.0e3
        vertical length-scale:
          - groups: [common]
            value: 11

